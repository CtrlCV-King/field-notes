name: Publish photography site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync confirmed wildlife captions once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import concurrent.futures, re, time, urllib.request
          base = 'https://field-notes-zhou.dearmug64.chatgpt.site/'
          def fetch(url):
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'Field-Notes-Migration/1.0'})
                      return urllib.request.urlopen(request, timeout=90).read()
                  except Exception:
                      if attempt == 3: raise
                      time.sleep(2 ** attempt)
          if not Path('index.html').exists() or 'confirmed-wildlife-20261017-v8' not in Path('index.html').read_text(encoding='utf-8'):
              html = fetch(base).decode('utf-8')
              html = re.sub(r'<script\b[^>]*>.*?</script>', lambda m: '' if 'challenge-platform' in m.group(0) else m.group(0), html, flags=re.S)
              assert 'confirmed-wildlife-20261017-v8' in html and 'const photos=' in html and 'id="notes"' not in html and 'BEHIND THE LENS' in html and '一起等一场日出' in html
              assets = sorted(set(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:jpg|jpeg|png|avif)', html)))
              assets = sorted(set(assets) | {re.sub(r'\.jpe?g$', '.avif', a.replace('/originals/', '/previews/').replace('/display/', '/previews/')) for a in assets if '/originals/' in a or '/display/' in a})
              assert len(assets) >= 275, f'Expected at least 275 images, found {len(assets)}'
              def download(asset):
                  assert '..' not in asset
                  if Path(asset).exists():
                      return
                  data = fetch(base + asset)
                  assert data[:2] == b'\xff\xd8' or data[:8] == b'\x89PNG\r\n\x1a\n' or data[4:8] == b'ftyp', asset
                  destination = Path(asset)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  list(pool.map(download, assets))
              Path('index.html').write_text(html, encoding='utf-8')
              Path('.nojekyll').touch()
              Path('README.md').write_text('# 旷野来信 · 摄影与旅行\n\n摄影与旅行作品集。照片与文字版权归作者所有，未经许可请勿转载或使用。\n', encoding='utf-8')
              print(f'Imported {len(assets)} images and the complete website.')
          else:
              print('Using website files already saved in this repository.')
          PY
      - name: Route images through Cloudflare CDN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<meta name="image-cdn" content="cloudflare-v1">'
          cdn = 'https://field-notes-zhou.dearmug64.chatgpt.site/'
          if marker not in html:
              bootstrap = '''<script>
          const IMAGE_CDN = 'https://field-notes-zhou.dearmug64.chatgpt.site/';
          function imageSource(path){return path.startsWith('assets/')?IMAGE_CDN+path:path}
          document.addEventListener('error',function(event){
            const img=event.target;
            if(!(img instanceof HTMLImageElement))return;
            const source=img.currentSrc||img.src;
            if(source.startsWith(IMAGE_CDN)){
              const relative=source.slice(IMAGE_CDN.length);
              if(relative.startsWith('assets/')){
                img.dataset.imageRoute='github-fallback';
                img.removeAttribute('srcset');
                img.src=relative;
              }
            }
          },true);
          </script>'''
              head = marker + '<link rel="preconnect" href="' + cdn.rstrip('/') + '"><link rel="dns-prefetch" href="//field-notes-zhou.dearmug64.chatgpt.site">' + bootstrap
              html = html.replace('<head>', '<head>' + head, 1)
              html = re.sub(r'(<img\b[^>]*\bsrc=")(assets/[^"]+)(")', lambda m: m[1] + cdn + m[2] + m[3], html)
              pattern = r"function previewSource\(p\)\{return ([^\n]+?)\}"
              html, preview_count = re.subn(pattern, lambda m: 'function previewSource(p){return imageSource(' + m[1] + ')}', html)
              assert preview_count == 1, 'Preview source helper changed; review CDN transform.'
              assert 'large.src=p.src;' in html, 'Viewer source changed; review CDN transform.'
              html = html.replace('large.src=p.src;', 'large.src=imageSource(p.src);', 1)
              path.write_text(html, encoding='utf-8')
          assert 'large.src=imageSource(p.src);' in html
          assert 'function previewSource(p){return imageSource(' in html
          assert 'github-fallback' in html
          print('CDN images enabled; local GitHub originals remain the download and error fallback.')
          PY
      - name: Save imported files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll README.md
          if ! git diff --cached --quiet; then
            git commit -m "Enable Cloudflare image delivery with GitHub fallback"
            git push
          fi
      - name: Prepare published files
        run: |
          mkdir -p _site
          cp index.html travel-map.html .nojekyll _site/
          cp -R assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
